<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenCode Go Optimizer</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="OpenCode Go Model Optimizer Tier Selections and Documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/themes/core.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/themes/addons/core-dark.min.css" media="(prefers-color-scheme: dark)" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism.min.css" crossorigin="anonymous">
  <style>
    .mermaid {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 1.5rem auto;
      padding: 1rem;
      overflow-x: auto;
      max-width: 100%;
      background: transparent;
    }
    .mermaid svg {
      max-width: 100%;
      height: auto;
    }
    .chart-svg,
    img[src$=".svg"] {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1.5rem auto;
      padding: 0.5rem;
      border-radius: 6px;
    }
    @media (prefers-color-scheme: dark) {
      .mermaid {
        color: #e6edf3;
      }
      .chart-svg,
      img[src$=".svg"] {
        filter: brightness(0.95) contrast(1.05);
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (function () {
      var repoUrl = '{{REPO_URL}}';
      if (repoUrl.indexOf('{{') === 0) {
        var host = window.location.hostname;
        var parts = window.location.pathname.split('/').filter(Boolean);
        repoUrl = (host.endsWith('.github.io') && parts.length > 0)
          ? 'https://github.com/' + host.replace(/\.github\.io$/, '') + '/' + parts[0]
          : '';
      }
      window.$docsify = {
        name: 'OpenCode Go Optimizer',
        repo: repoUrl,
        loadSidebar: true,
        auto2top: true,
        maxLevel: 4,
        subMaxLevel: 3,
        search: {
          maxAge: 86400000,
          paths: 'auto',
          placeholder: 'Search tiers, models, docs...',
          noData: 'No matching results',
          depth: 4
        },
        copyCode: {
          buttonText: 'Copy',
          errorText: 'Error',
          successText: 'Copied'
        },
        pagination: {
          crossChapter: true,
          crossChapterText: true
        },
        plugins: [
          function (hook) {
            hook.beforeEach(function (md) {
              return md.replace(/\{\{REPO_URL\}\}/g, repoUrl || '#');
            });
            hook.doneEach(function () {
              var targets = document.querySelectorAll('pre[data-lang="mermaid"], pre code.lang-mermaid, code.lang-mermaid');
              var processed = [];
              targets.forEach(function (el) {
                var pre = (el.tagName.toLowerCase() === 'pre') ? el : el.closest('pre');
                if (pre && processed.indexOf(pre) === -1 && pre.parentNode) {
                  processed.push(pre);
                  var code = pre.querySelector('code');
                  var text = code ? code.textContent : pre.textContent;
                  var div = document.createElement('div');
                  div.className = 'mermaid';
                  div.textContent = text;
                  pre.parentNode.replaceChild(div, pre);
                }
              });
              if (window.mermaid) {
                window.mermaid.initialize({
                  startOnLoad: false,
                  securityLevel: 'strict',
                  theme: (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'default'
                });
                window.mermaid.run({ querySelector: '.mermaid' });
              }
            });
          }
        ]
      };
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.min.js" defer crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/docsify.min.js" defer crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/plugins/search.min.js" defer crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.1.0/dist/plugins/zoom-image.min.js" defer crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js" defer crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js" defer crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/prism.min.js" defer crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js" defer crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-json.min.js" defer crossorigin="anonymous"></script>
</body>
</html>
