name: PR CI

# Pull request checks only: runs the shared test/lint/build suite (reusable
# ci.yml) and posts the results as a PR comment, then runs both optimizer
# calculation methods (Pareto and Allowance, without fallback) on the PR code
# and posts both outputs as a second PR comment so a reviewer sees both methods
# and sees immediately when Artificial Analysis fails. Repository secrets are
# available to same-repo PRs, so the AA key is loaded from 1Password and cached
# across 8-hour UTC slots to stay well within AA's 100 req/day free limit; fork
# PRs receive no secrets, skip 1Password, and mark Pareto unavailable without
# falling back. Only the issue upsert and the Pages deploy never run on a PR;
# they live in run-optimizer.yml, which triggers on push/schedule/dispatch.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  optimizer-output:
    name: Run Optimizer & Post Output Comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_NO_SYNC: "1"
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-env

      - name: Compute 8-hour AA cache slot
        id: aa_slot
        run: |
          slot="$(date -u +%Y-%m-%d)-s$(($(date -u +%-H) / 8))"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - name: Detect 1Password configuration
        id: opgate
        env:
          HAS_OP_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
          SECRET_REF: ${{ secrets.AA_SECRET_REF || vars.AA_SECRET_REF }}
        run: |
          if [[ "$HAS_OP_TOKEN" == "true" && -n "$SECRET_REF" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::1Password configuration is unavailable to this run (fork PR?); Pareto method will be unavailable without fallback."
          fi

      # Set OP_SERVICE_ACCOUNT_TOKEN in repository secrets and AA_SECRET_REF
      # (op://<vault>/<item>/<field>) in repository variables or secrets,
      # exactly as in run-optimizer.yml. Fork PRs never receive secrets.
      - name: Load AA API key from 1Password
        if: steps.opgate.outputs.available == 'true'
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          AA_API_KEY: ${{ secrets.AA_SECRET_REF || vars.AA_SECRET_REF }}

      - name: Restore Artificial Analysis cache
        id: aa_cache
        if: steps.opgate.outputs.available == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/opencode-go-model-optimizer/aa-benchmarks.json
          key: aa-benchmarks-v1-${{ hashFiles('src/opencode_go_model_optimizer/ingest/artificial_analysis.py') }}-${{ steps.aa_slot.outputs.slot }}-${{ github.run_id }}
          restore-keys: |
            aa-benchmarks-v1-${{ hashFiles('src/opencode_go_model_optimizer/ingest/artificial_analysis.py') }}-${{ steps.aa_slot.outputs.slot }}-

      - name: Fetch snapshot
        id: fetch
        continue-on-error: true
        env:
          OPENCODE_GO_AA_CACHE_TTL: "28800"
        run: |
          mkdir -p out
          status=0
          uv run opencode-go-model-optimizer fetch --plan go --out out/snapshot.json 2> out/fetch.log || status=$?
          cat out/fetch.log >&2 || true
          bench_src="none"
          if [[ -s out/snapshot.json ]]; then
            bench_src="$(uv run python -c "import json; d = json.load(open('out/snapshot.json')); print(d.get('metadata', {}).get('benchmark_source', 'none'))" 2>/dev/null || echo none)"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "benchmark_source=$bench_src" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Check AA cache file
        id: aa_file
        if: steps.opgate.outputs.available == 'true' && steps.aa_cache.outputs.cache-matched-key == ''
        run: |
          if [[ -s ~/.cache/opencode-go-model-optimizer/aa-benchmarks.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Artificial Analysis cache
        if: steps.opgate.outputs.available == 'true' && steps.aa_cache.outputs.cache-matched-key == '' && steps.aa_file.outputs.exists == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/opencode-go-model-optimizer/aa-benchmarks.json
          key: aa-benchmarks-v1-${{ hashFiles('src/opencode_go_model_optimizer/ingest/artificial_analysis.py') }}-${{ steps.aa_slot.outputs.slot }}-${{ github.run_id }}

      # Run BOTH calculation methods against the same snapshot without fallback
      # so any Artificial Analysis failure is immediately obvious.
      - name: Run optimizer (Pareto & Allowance, no fallback)
        id: optimizer
        continue-on-error: true
        env:
          AA_AVAILABLE: ${{ steps.opgate.outputs.available }}
        run: |
          mkdir -p out
          pareto_status=0
          allowance_status=0

          uv run opencode-go-model-optimizer select --plan go --mode pareto --snapshot out/snapshot.json \
            --format table --explain --allow-global-region --allow-free-training \
            > out/pareto.txt 2> out/pareto.err || pareto_status=$?

          uv run opencode-go-model-optimizer select --plan go --mode allowance --snapshot out/snapshot.json \
            --format table --explain --allow-global-region --allow-free-training \
            > out/allowance.txt 2> out/allowance.err || allowance_status=$?

          cp out/pareto.txt out/pareto_combined.txt
          if [[ -s out/pareto.err ]]; then
            printf '\n--- stderr ---\n' >> out/pareto_combined.txt
            cat out/pareto.err >> out/pareto_combined.txt
          fi

          cp out/allowance.txt out/allowance_combined.txt
          if [[ -s out/allowance.err ]]; then
            printf '\n--- stderr ---\n' >> out/allowance_combined.txt
            cat out/allowance.err >> out/allowance_combined.txt
          fi

          echo "pareto_status=$pareto_status" >> "$GITHUB_OUTPUT"
          echo "allowance_status=$allowance_status" >> "$GITHUB_OUTPUT"
          cat out/pareto.txt out/allowance.txt
          cat out/pareto.err out/allowance.err >&2

          if [[ "$allowance_status" -ne 0 ]]; then
            exit "$allowance_status"
          fi
          if [[ "$AA_AVAILABLE" == "true" && "$pareto_status" -ne 0 ]]; then
            exit "$pareto_status"
          fi

      - name: Render optimizer output comment
        if: always()
        env:
          SERVER_URL: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AA_AVAILABLE: ${{ steps.opgate.outputs.available }}
          BENCH_SOURCE: ${{ steps.fetch.outputs.benchmark_source }}
          PARETO_STATUS: ${{ steps.optimizer.outputs.pareto_status }}
          ALLOWANCE_STATUS: ${{ steps.optimizer.outputs.allowance_status }}
        run: |
          run_url="${SERVER_URL}/${GH_REPO}/actions/runs/${RUN_ID}"
          if [[ "$AA_AVAILABLE" != "true" ]]; then
            benchmarks=unavailable
          elif [[ "$BENCH_SOURCE" == "aa_cache" ]]; then
            benchmarks=cache
          else
            benchmarks=live
          fi
          uv run python scripts/render_optimizer_issue.py \
            --pareto-output out/pareto_combined.txt \
            --pareto-status "$PARETO_STATUS" \
            --allowance-output out/allowance_combined.txt \
            --allowance-status "$ALLOWANCE_STATUS" \
            --fetch-log out/fetch.log \
            --run-url "$run_url" \
            --sha "$COMMIT_SHA" \
            --benchmarks "$benchmarks" \
            --output out/comment.md
          cat out/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR comment with optimizer output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export MARKER="<!-- optimizer-output-comment:commit=${COMMIT_SHA} -->"

          if [[ ! -s out/comment.md ]]; then
            echo "Warning: out/comment.md is empty"
            exit 0
          fi

          comment_id="$(gh api --paginate --slurp "repos/$GH_REPO/issues/${PR_NUMBER}/comments" \
            --jq 'flatten | map(select(.body | contains(env.MARKER))) | last | .id // empty' \
            2>/dev/null || true)"

          if [[ -n "$comment_id" ]]; then
            if ! gh api "repos/$GH_REPO/issues/comments/${comment_id}" \
              -X PATCH -F body=@out/comment.md >/dev/null 2>&1; then
              echo "::notice::Skipping PR comment update (read-only token on fork PR); see Job Summary."
            fi
          else
            if ! gh pr comment "$PR_NUMBER" \
              --repo "$GH_REPO" \
              --body-file out/comment.md >/dev/null 2>&1; then
              echo "::notice::Skipping PR comment creation (read-only token on fork PR); see Job Summary."
            fi
          fi

      - name: Fail if the optimizer run failed
        if: steps.optimizer.outcome == 'failure'
        run: |
          echo "::error::The optimizer run failed (check Pareto/Allowance output in PR comment)."
          exit 1
