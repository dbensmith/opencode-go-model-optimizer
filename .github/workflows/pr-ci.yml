name: PR CI

# Pull request checks only: runs the shared test/lint/build suite (reusable
# ci.yml) and posts the results as a PR comment, then runs both optimizer
# calculation methods (Pareto and Allowance, without fallback) on the PR code
# and posts both outputs as a second PR comment so a reviewer sees both methods
# and sees immediately when Artificial Analysis fails. Repository secrets are
# available to same-repo PRs, so the AA key is loaded from 1Password and reuses
# the 24-hour AA benchmark cache (plus persisted 429 cooldown state) so PRs not
# changing artificial_analysis.py spend 0 AA requests; fork PRs receive no
# secrets, skip 1Password, and mark Pareto unavailable without falling back. Only
# the Pages artifact build and deploy never run on a PR; they live in
# run-optimizer.yml, which triggers on push/schedule/dispatch.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  optimizer-output:
    needs: test
    name: Run Optimizer & Post Output Comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_NO_SYNC: "1"
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-env

      - name: Compute UTC day for AA cache
        id: aa_day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Detect 1Password configuration
        id: opgate
        env:
          HAS_OP_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
          SECRET_REF: ${{ secrets.AA_SECRET_REF || vars.AA_SECRET_REF }}
        run: |
          if [[ "$HAS_OP_TOKEN" == "true" && -n "$SECRET_REF" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::1Password configuration is unavailable to this run (fork PR?); Pareto method will be unavailable without fallback."
          fi

      # Set OP_SERVICE_ACCOUNT_TOKEN in repository secrets and AA_SECRET_REF
      # (op://<vault>/<item>/<field>) in repository variables or secrets,
      # exactly as in run-optimizer.yml. Fork PRs never receive secrets.
      - name: Load AA API key from 1Password
        if: steps.opgate.outputs.available == 'true'
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          AA_API_KEY: ${{ secrets.AA_SECRET_REF || vars.AA_SECRET_REF }}

      - name: Restore Artificial Analysis cache
        id: aa_cache
        if: steps.opgate.outputs.available == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/opencode-go-model-optimizer/aa-benchmarks.json
          key: aa-benchmarks-v2-${{ hashFiles('src/opencode_go_model_optimizer/ingest/artificial_analysis.py') }}-${{ steps.aa_day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aa-benchmarks-v2-${{ hashFiles('src/opencode_go_model_optimizer/ingest/artificial_analysis.py') }}-${{ steps.aa_day.outputs.day }}-
            aa-benchmarks-v2-${{ hashFiles('src/opencode_go_model_optimizer/ingest/artificial_analysis.py') }}-

      - name: Restore Artificial Analysis cooldown state
        id: aa_cooldown
        if: steps.opgate.outputs.available == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/opencode-go-model-optimizer/aa-ratelimit.json
          key: aa-ratelimit-v1-${{ steps.aa_day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aa-ratelimit-v1-${{ steps.aa_day.outputs.day }}-
            aa-ratelimit-v1-

      - name: Fetch snapshot
        id: fetch
        continue-on-error: true
        env:
          OPENCODE_GO_AA_CACHE_TTL: "86400"
        run: |
          mkdir -p out
          cache_dir="$HOME/.cache/opencode-go-model-optimizer"
          rl_file="${cache_dir}/aa-ratelimit.json"
          aa_file="${cache_dir}/aa-benchmarks.json"
          rl_before=""
          if [[ -s "$rl_file" ]]; then
            rl_before="$(sha256sum "$rl_file" | awk '{print $1}')"
          fi

          status=0
          uv run opencode-go-model-optimizer fetch --plan go --out out/snapshot.json 2> out/fetch.log || status=$?
          cat out/fetch.log >&2 || true
          bench_src="none"
          if [[ -s out/snapshot.json ]]; then
            bench_src="$(uv run python -c "import json; d = json.load(open('out/snapshot.json')); print(d.get('metadata', {}).get('benchmark_source', 'none'))" 2>/dev/null || echo none)"
          fi
          aa_cache_exists="false"
          if [[ -s "$aa_file" ]]; then
            aa_cache_exists="true"
          fi
          rl_after=""
          if [[ -s "$rl_file" ]]; then
            rl_after="$(sha256sum "$rl_file" | awk '{print $1}')"
          fi
          ratelimit_updated="false"
          if [[ -n "$rl_after" && "$rl_after" != "$rl_before" ]]; then
            ratelimit_updated="true"
          fi
          {
            echo "status=$status"
            echo "benchmark_source=$bench_src"
            echo "aa_cache_exists=$aa_cache_exists"
            echo "ratelimit_updated=$ratelimit_updated"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Save Artificial Analysis cache
        if: steps.opgate.outputs.available == 'true' && steps.fetch.outputs.benchmark_source == 'aa_live' && steps.fetch.outputs.aa_cache_exists == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/opencode-go-model-optimizer/aa-benchmarks.json
          key: aa-benchmarks-v2-${{ hashFiles('src/opencode_go_model_optimizer/ingest/artificial_analysis.py') }}-${{ steps.aa_day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Artificial Analysis cooldown state
        if: always() && steps.opgate.outputs.available == 'true' && steps.fetch.outputs.ratelimit_updated == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/opencode-go-model-optimizer/aa-ratelimit.json
          key: aa-ratelimit-v1-${{ steps.aa_day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Run BOTH calculation methods against the same snapshot without fallback
      # so any Artificial Analysis failure is immediately obvious.
      - name: Run optimizer (Pareto & Allowance, no fallback)
        id: optimizer
        continue-on-error: true
        env:
          AA_AVAILABLE: ${{ steps.opgate.outputs.available }}
        run: |
          mkdir -p out
          for method in pareto allowance; do
            status=0
            uv run opencode-go-model-optimizer select --plan go --mode "$method" --snapshot out/snapshot.json \
              --format json --explain --allow-global-region --allow-free-training \
              > "out/${method}.json" 2> "out/${method}.err" || status=$?
            printf -v "${method}_status" '%s' "$status"
          done

          echo "pareto_status=$pareto_status" >> "$GITHUB_OUTPUT"
          echo "allowance_status=$allowance_status" >> "$GITHUB_OUTPUT"
          cat out/pareto.json out/allowance.json
          cat out/pareto.err out/allowance.err >&2

          if [[ "$allowance_status" -ne 0 ]]; then
            exit "$allowance_status"
          fi
          if [[ "$AA_AVAILABLE" == "true" && "$pareto_status" -ne 0 ]]; then
            exit "$pareto_status"
          fi

      - name: Render optimizer output comment
        if: always()
        env:
          SERVER_URL: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AA_AVAILABLE: ${{ steps.opgate.outputs.available }}
          BENCH_SOURCE: ${{ steps.fetch.outputs.benchmark_source }}
          PARETO_STATUS: ${{ steps.optimizer.outputs.pareto_status }}
          ALLOWANCE_STATUS: ${{ steps.optimizer.outputs.allowance_status }}
        run: |
          run_url="${SERVER_URL}/${GH_REPO}/actions/runs/${RUN_ID}"
          if [[ "$AA_AVAILABLE" != "true" ]]; then
            benchmarks=unavailable
          elif [[ "$BENCH_SOURCE" == "aa_cache" ]]; then
            benchmarks=cache
          else
            benchmarks=live
          fi
          uv run python scripts/render_optimizer_issue.py \
            --pareto-json out/pareto.json \
            --pareto-stderr out/pareto.err \
            --pareto-status "$PARETO_STATUS" \
            --allowance-json out/allowance.json \
            --allowance-stderr out/allowance.err \
            --allowance-status "$ALLOWANCE_STATUS" \
            --fetch-log out/fetch.log \
            --run-url "$run_url" \
            --sha "$COMMIT_SHA" \
            --benchmarks "$benchmarks" \
            --output out/comment.md
          cat out/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR comment with optimizer output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export MARKER="<!-- optimizer-output-comment:commit=${COMMIT_SHA} -->"

          if [[ ! -s out/comment.md ]]; then
            echo "Warning: out/comment.md is empty"
            exit 0
          fi

          comment_id="$(gh api --paginate --slurp "repos/$GH_REPO/issues/${PR_NUMBER}/comments" \
            --jq 'flatten | map(select(.body | contains(env.MARKER))) | last | .id // empty' \
            2>/dev/null || true)"

          if [[ -n "$comment_id" ]]; then
            if ! gh api "repos/$GH_REPO/issues/comments/${comment_id}" \
              -X PATCH -F body=@out/comment.md >/dev/null 2>&1; then
              echo "::notice::Skipping PR comment update (read-only token on fork PR); see Job Summary."
            fi
          else
            if ! gh pr comment "$PR_NUMBER" \
              --repo "$GH_REPO" \
              --body-file out/comment.md >/dev/null 2>&1; then
              echo "::notice::Skipping PR comment creation (read-only token on fork PR); see Job Summary."
            fi
          fi

      - name: Fail if the optimizer run failed
        if: steps.optimizer.outcome == 'failure'
        run: |
          echo "::error::The optimizer run failed (check Pareto/Allowance output in PR comment)."
          exit 1
