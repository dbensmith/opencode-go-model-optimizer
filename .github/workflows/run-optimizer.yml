name: Run Optimizer

# Runs the OpenCode Go model optimizer every 8 hours starting at 02:00 ET (07:00, 15:00,
# 23:00 UTC in EST / UTC-5) and on demand, retrieves AA_API_KEY from 1Password via a
# service account token, creates or updates the tracking GitHub issue labeled
# `optimizer-results`, AND publishes the Docsify site to GitHub Pages on the same schedule.
# Also runs tests on pushes to main. Pull request checks live in pr-ci.yml; this
# workflow never runs on a PR.
#
# CI privacy policy: pass --allow-global-region and --allow-free-training so Global-region
# models and free models that train are eligible. Paid and consent-required training remain
# blocked (the OpenCode Go defaults).
#
# Runner choice: `ubuntu-latest` was selected over `ubuntu-slim` after benchmarking 5 runs
# each (ubuntu-latest averaged 12.80s exec / 14.80s wall vs ubuntu-slim 16.60s exec / 19.80s wall).

on:
  push:
    branches: [main]
  schedule:
    # 02:00, 10:00, 18:00 EST (UTC-5) — GitHub Actions cron evaluates in UTC.
    - cron: "0 7,15,23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Optimizer mode (pareto, auto, or allowance)"
        required: false
        default: "pareto"
        type: choice
        options:
          - pareto
          - auto
          - allowance
      plan:
        description: "OpenCode plan tier"
        required: false
        default: "go"
        type: choice
        options:
          - go
          - go-plus
          - go-teams

permissions:
  contents: read

concurrency:
  group: run-optimizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  optimize:
    needs: test
    name: Run Optimizer, Update Issue & Publish Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          sync-args: "--no-dev"

      - name: Validate 1Password configuration
        env:
          HAS_OP_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
          SECRET_REF: ${{ secrets.AA_SECRET_REF || vars.AA_SECRET_REF }}
        run: |
          if [[ "$HAS_OP_TOKEN" != "true" ]]; then
            echo "::error::Repository secret OP_SERVICE_ACCOUNT_TOKEN is not set."
            exit 1
          fi
          if [[ -z "$SECRET_REF" ]]; then
            echo "::error::AA_SECRET_REF (op://<vault>/<item>/<field>) must be set in repository variables or secrets."
            exit 1
          fi

      # Set OP_SERVICE_ACCOUNT_TOKEN in repository secrets and AA_SECRET_REF
      # (op://<vault>/<item>/<field>) in repository variables or secrets.
      - name: Load AA API key from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          AA_API_KEY: ${{ secrets.AA_SECRET_REF || vars.AA_SECRET_REF }}

      # Resolves the Pages site URL up front so the issue can link the published
      # dataset (rank.json, select.json, per-plan selections, analysis) in the
      # same run that renders it.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Run optimizer
        env:
          OPTIMIZER_MODE: ${{ inputs.mode || 'pareto' }}
          OPTIMIZER_PLAN: ${{ inputs.plan || 'go' }}
          UV_NO_SYNC: "1"
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p out
          # Run JSON first with --cache-ttl so the subsequent table run shares the exact snapshot.
          if ! scripts/run-optimizer.sh --plan "$OPTIMIZER_PLAN" --cache-ttl 300 --format json \
            --allow-global-region --allow-free-training > out/select.json 2> out/script.log; then
            cat out/script.log >&2
            exit 1
          fi
          if ! scripts/run-optimizer.sh --plan "$OPTIMIZER_PLAN" --cache-ttl 300 \
            --allow-global-region --allow-free-training > out/table.txt 2> out/table.err; then
            cat out/table.err >&2
            exit 1
          fi
          cp out/table.txt out/full_output.txt
          if [[ -s out/script.log || -s out/table.err ]]; then
            printf '\n--- stderr ---\n' >> out/full_output.txt
            cat out/script.log out/table.err >> out/full_output.txt
          fi
          mkdir -p out/plans
          uv run opencode-go-model-optimizer rank --plan "$OPTIMIZER_PLAN" --mode "$OPTIMIZER_MODE" --cache-ttl 300 --format json --allow-global-region --allow-free-training > out/rank.json
          for p in go go-plus go-teams; do
            uv run opencode-go-model-optimizer select --plan "$p" --mode "$OPTIMIZER_MODE" --cache-ttl 300 --top-n 3 --format json --explain --allow-global-region --allow-free-training > "out/plans/${p}.json"
          done

          python3 - << 'EOF'
          import json, subprocess, os
          plan = os.environ.get("OPTIMIZER_PLAN", "go")
          mode = os.environ.get("OPTIMIZER_MODE", "pareto")
          matrix = [
              {"label": "Default (no training, region locked)", "flags": "", "model_id": ""},
              {"label": "Allow free training", "flags": "--allow-free-training", "model_id": ""},
              {"label": "Allow global region", "flags": "--allow-global-region", "model_id": ""},
              {"label": "Allow both (CI setting)", "flags": "--allow-global-region --allow-free-training", "model_id": ""}
          ]
          for row in matrix:
              cmd = ["uv", "run", "opencode-go-model-optimizer", "select", "--plan", plan, "--mode", mode, "--cache-ttl", "300", "--format", "json"] + row["flags"].split()
              cmd = [c for c in cmd if c]
              res = subprocess.run(cmd, capture_output=True, text=True)
              if res.returncode != 0:
                  row["model_id"] = "Error"
              elif res.stdout.strip():
                  try:
                      data = json.loads(res.stdout)
                      row["model_id"] = data.get("tiers", {}).get("free", "None")
                  except Exception:
                      row["model_id"] = "Error"
          import pathlib
          pathlib.Path("out/free-matrix.json").write_text(json.dumps(matrix, indent=2), encoding="utf-8")
          EOF

          run_url="${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
          uv run python scripts/render_optimizer_issue.py \
            --json out/select.json \
            --script-output out/full_output.txt \
            --run-url "$run_url" \
            --site-url "$SITE_URL" \
            --output out/issue.md \
            --rank-json out/rank.json \
            --plan-json go=out/plans/go.json \
            --plan-json go-plus=out/plans/go-plus.json \
            --plan-json go-teams=out/plans/go-teams.json \
            --free-matrix-json out/free-matrix.json \
            --charts-dir out/charts \
            --analysis-output out/analysis.md

          cat out/issue.md >> "$GITHUB_STEP_SUMMARY"

          mkdir -p out/site
          cp -a docs/. out/site/
          cp out/issue.md out/site/README.md
          cp out/analysis.md out/site/analysis.md
          cp README.md out/site/usage.md
          cp out/select.json out/site/select.json
          cp out/rank.json out/site/rank.json
          cp -a out/plans out/site/plans
          cp out/free-matrix.json out/site/free-matrix.json
          cp -a out/charts out/site/charts

          repo_url="${GITHUB_SERVER_URL}/${GH_REPO}"
          issues_url="${repo_url}/issues?q=is%3Aissue+is%3Aopen+label%3Aoptimizer-results"
          sed -i \
            -e "s|{{REPO_URL}}|${repo_url}|g" \
            -e "s|{{ISSUES_URL}}|${issues_url}|g" \
            out/site/index.html out/site/_sidebar.md

      - name: Create or update GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_LABEL: optimizer-results
          ISSUE_TITLE: "OpenCode Go Model Optimizer — Latest Tier Selections"
        run: |
          gh label create "$ISSUE_LABEL" \
            --repo "$GH_REPO" \
            --description "Automated OpenCode Go model optimizer results" \
            --color "0e8a16" \
            --force

          issue_number="$(gh issue list \
            --repo "$GH_REPO" \
            --label "$ISSUE_LABEL" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" \
              --repo "$GH_REPO" \
              --title "$ISSUE_TITLE" \
              --body-file out/issue.md
            echo "Updated existing issue #$issue_number"
          else
            gh issue create \
              --repo "$GH_REPO" \
              --title "$ISSUE_TITLE" \
              --label "$ISSUE_LABEL" \
              --body-file out/issue.md
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
