name: Run Optimizer

# Runs both OpenCode Go model optimizer methods (Pareto and Allowance, without
# fallback) every 8 hours starting at 02:00 ET (07:00, 15:00, 23:00 UTC in EST /
# UTC-5) and on demand, retrieves AA_API_KEY from 1Password via a service
# account token, publishes the output of both methods to the tracking GitHub
# issue labeled `optimizer-results` and uploads the rendered Docsify site as a
# `docs-site` artifact. To protect Artificial Analysis's 100 req/day free tier,
# live AA fetches are cached daily (22h TTL on cron so 07:00 UTC refreshes AA
# once per day while 15:00/23:00 UTC reuse that day's AA cache for 4 req/day
# total; 24h TTL on push/default manual runs; pass `refresh_aa=true` to force a
# live AA refresh), and 429 cooldown state is persisted across runs. Publishing the
# artifact to GitHub Pages is handled by `publish-pages.yml`. Also runs tests on
# pushes to main. Pull request checks live in pr-ci.yml; this workflow never runs
# on a PR.
#
# CI privacy policy: pass --allow-global-region and --allow-free-training so Global-region
# models and free models that train are eligible. Paid and consent-required training remain
# blocked (the OpenCode Go defaults).
#
# Runner choice: `ubuntu-latest` was selected over `ubuntu-slim` after benchmarking 5 runs
# each (ubuntu-latest averaged 12.80s exec / 14.80s wall vs ubuntu-slim 16.60s exec / 19.80s wall).

on:
  push:
    branches: [main]
  schedule:
    # 02:00, 10:00, 18:00 EST (UTC-5) — GitHub Actions cron evaluates in UTC.
    - cron: "0 7,15,23 * * *"
  workflow_dispatch:
    inputs:
      plan:
        description: "OpenCode plan tier"
        required: false
        default: "go"
        type: choice
        options:
          - go
          - go-plus
          - go-teams
      refresh_aa:
        description: "Force a live Artificial Analysis fetch (bypassing the daily cache)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: run-optimizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # ci.yml declares this for its PR-comment step; reusable workflows fail at
      # startup if the caller does not grant every permission they declare.
      pull-requests: write

  optimize:
    needs: test
    name: Run Optimizer & Update Issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      # configure-pages only reads Pages metadata to resolve the site URL for
      # the issue's dataset links; the deployment itself lives in
      # publish-pages.yml, which holds pages: write and id-token: write.
      pages: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          sync-args: "--no-dev"

      - name: Compute UTC day for AA cache
        id: aa_day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Validate 1Password configuration
        env:
          HAS_OP_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
          SECRET_REF: ${{ secrets.AA_SECRET_REF || vars.AA_SECRET_REF }}
        run: |
          if [[ "$HAS_OP_TOKEN" != "true" ]]; then
            echo "::error::Repository secret OP_SERVICE_ACCOUNT_TOKEN is not set."
            exit 1
          fi
          if [[ -z "$SECRET_REF" ]]; then
            echo "::error::AA_SECRET_REF (op://<vault>/<item>/<field>) must be set in repository variables or secrets."
            exit 1
          fi

      # Set OP_SERVICE_ACCOUNT_TOKEN in repository secrets and AA_SECRET_REF
      # (op://<vault>/<item>/<field>) in repository variables or secrets.
      - name: Load AA API key from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          AA_API_KEY: ${{ secrets.AA_SECRET_REF || vars.AA_SECRET_REF }}

      # Reuse the daily AA benchmark cache across pushes, default manual runs, and
      # secondary daily cron runs (07:00 UTC refreshes AA via the 22h cron TTL;
      # 15:00/23:00 UTC reuse it for 4 req/day steady state).
      - name: Restore Artificial Analysis cache
        id: aa_cache
        if: github.event_name != 'workflow_dispatch' || !inputs.refresh_aa
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/opencode-go-model-optimizer/aa-benchmarks.json
          key: aa-benchmarks-v2-${{ hashFiles('src/opencode_go_model_optimizer/ingest/artificial_analysis.py') }}-${{ steps.aa_day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aa-benchmarks-v2-${{ hashFiles('src/opencode_go_model_optimizer/ingest/artificial_analysis.py') }}-${{ steps.aa_day.outputs.day }}-
            aa-benchmarks-v2-${{ hashFiles('src/opencode_go_model_optimizer/ingest/artificial_analysis.py') }}-

      - name: Restore Artificial Analysis cooldown state
        id: aa_cooldown
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/opencode-go-model-optimizer/aa-ratelimit.json
          key: aa-ratelimit-v1-${{ steps.aa_day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aa-ratelimit-v1-${{ steps.aa_day.outputs.day }}-
            aa-ratelimit-v1-

      # Resolves the Pages site URL up front so the issue can link the published
      # dataset in the same run that renders it.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Fetch snapshot for this run
        id: fetch
        env:
          OPTIMIZER_PLAN: ${{ inputs.plan || 'go' }}
          EVENT_NAME: ${{ github.event_name }}
          REFRESH_AA: ${{ inputs.refresh_aa || false }}
          UV_NO_SYNC: "1"
        run: |
          mkdir -p out
          cache_dir="$HOME/.cache/opencode-go-model-optimizer"
          rl_file="${cache_dir}/aa-ratelimit.json"
          aa_file="${cache_dir}/aa-benchmarks.json"
          rl_before=""
          if [[ -s "$rl_file" ]]; then
            rl_before="$(sha256sum "$rl_file" | awk '{print $1}')"
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REFRESH_AA" == "true" ]]; then
            export OPENCODE_GO_AA_CACHE_TTL="0"
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            export OPENCODE_GO_AA_CACHE_TTL="79200"
          else
            export OPENCODE_GO_AA_CACHE_TTL="86400"
          fi

          if ! uv run opencode-go-model-optimizer fetch --plan "$OPTIMIZER_PLAN" \
            --out out/snapshot.json 2> out/fetch.log; then
            cat out/fetch.log >&2
            exit 1
          fi
          cat out/fetch.log >&2 || true

          bench_src="none"
          if [[ -s out/snapshot.json ]]; then
            bench_src="$(uv run python -c "import json; d = json.load(open('out/snapshot.json')); print(d.get('metadata', {}).get('benchmark_source', 'none'))" 2>/dev/null || echo none)"
          fi
          aa_cache_exists="false"
          if [[ -s "$aa_file" ]]; then
            aa_cache_exists="true"
          fi
          rl_after=""
          if [[ -s "$rl_file" ]]; then
            rl_after="$(sha256sum "$rl_file" | awk '{print $1}')"
          fi
          ratelimit_updated="false"
          if [[ -n "$rl_after" && "$rl_after" != "$rl_before" ]]; then
            ratelimit_updated="true"
          fi
          {
            echo "benchmark_source=$bench_src"
            echo "aa_cache_exists=$aa_cache_exists"
            echo "ratelimit_updated=$ratelimit_updated"
          } >> "$GITHUB_OUTPUT"

      - name: Save Artificial Analysis cache
        if: steps.fetch.outputs.benchmark_source == 'aa_live' && steps.fetch.outputs.aa_cache_exists == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/opencode-go-model-optimizer/aa-benchmarks.json
          key: aa-benchmarks-v2-${{ hashFiles('src/opencode_go_model_optimizer/ingest/artificial_analysis.py') }}-${{ steps.aa_day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Artificial Analysis cooldown state
        if: always() && steps.fetch.outputs.ratelimit_updated == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/opencode-go-model-optimizer/aa-ratelimit.json
          key: aa-ratelimit-v1-${{ steps.aa_day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run optimizer (Pareto & Allowance, no fallback)
        id: optimizer
        env:
          OPTIMIZER_PLAN: ${{ inputs.plan || 'go' }}
          UV_NO_SYNC: "1"
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p out/pareto/plans out/allowance/plans out/charts
          snapshot_args=(--snapshot out/snapshot.json)
          privacy_args=(--allow-global-region --allow-free-training)

          # 1. Pareto method (NO fallback)
          pareto_status=0
          OPTIMIZER_MODE=pareto scripts/run-optimizer.sh --plan "$OPTIMIZER_PLAN" "${snapshot_args[@]}" --format json "${privacy_args[@]}" \
            > out/pareto/select.json 2> out/pareto/select.err || pareto_status=$?

          if [[ "$pareto_status" -eq 0 ]]; then
            OPTIMIZER_MODE=pareto scripts/run-optimizer.sh --plan "$OPTIMIZER_PLAN" "${snapshot_args[@]}" "${privacy_args[@]}" \
              > out/pareto/table.txt 2> out/pareto/table.err || pareto_status=$?
          fi

          if [[ "$pareto_status" -eq 0 ]]; then
            uv run opencode-go-model-optimizer rank --plan "$OPTIMIZER_PLAN" --mode pareto "${snapshot_args[@]}" --format json "${privacy_args[@]}" \
              > out/pareto/rank.json 2> out/pareto/rank.err || pareto_status=$?
            for p in go go-plus go-teams; do
              uv run opencode-go-model-optimizer select --plan "$p" --mode pareto "${snapshot_args[@]}" --top-n 3 --format json --explain "${privacy_args[@]}" \
                > "out/pareto/plans/${p}.json" 2>> out/pareto/plans.err || pareto_status=$?
            done
          else
            rm -f out/pareto/select.json out/pareto/rank.json out/pareto/plans/*.json
            {
              cat out/fetch.log 2>/dev/null || true
              cat out/pareto/select.err 2>/dev/null || true
              cat out/pareto/table.err 2>/dev/null || true
            } > out/pareto/error.txt
          fi

          # 2. Allowance method (always run independently, no fallback)
          allowance_status=0
          uv run opencode-go-model-optimizer select --plan "$OPTIMIZER_PLAN" --mode allowance "${snapshot_args[@]}" --format json --explain "${privacy_args[@]}" \
            > out/allowance/select.json 2> out/allowance/select.err || allowance_status=$?
          uv run opencode-go-model-optimizer select --plan "$OPTIMIZER_PLAN" --mode allowance "${snapshot_args[@]}" --format table --explain "${privacy_args[@]}" \
            > out/allowance/table.txt 2> out/allowance/table.err || allowance_status=$?
          uv run opencode-go-model-optimizer rank --plan "$OPTIMIZER_PLAN" --mode allowance "${snapshot_args[@]}" --format json "${privacy_args[@]}" \
            > out/allowance/rank.json 2> out/allowance/rank.err || allowance_status=$?
          for p in go go-plus go-teams; do
            uv run opencode-go-model-optimizer select --plan "$p" --mode allowance "${snapshot_args[@]}" --top-n 3 --format json --explain "${privacy_args[@]}" \
              > "out/allowance/plans/${p}.json" 2>> out/allowance/plans.err || allowance_status=$?
          done

          # Combine full output of both methods for inspection
          {
            echo "=== Pareto Method (--mode pareto, no fallback) ==="
            if [[ "$pareto_status" -eq 0 ]]; then
              cat out/pareto/table.txt
            else
              echo "Pareto calculation FAILED (exit $pareto_status; no fallback used)."
            fi
            cat out/pareto/select.err out/pareto/table.err out/pareto/rank.err out/pareto/plans.err 2>/dev/null || true
            echo ""
            echo "=== Allowance Method (--mode allowance) ==="
            cat out/allowance/table.txt 2>/dev/null || true
            cat out/allowance/select.err out/allowance/table.err out/allowance/rank.err out/allowance/plans.err 2>/dev/null || true
            if [[ -s out/fetch.log ]]; then
              printf '\n--- fetch stderr ---\n'
              cat out/fetch.log
            fi
          } > out/full_output.txt

          python3 - << 'EOF'
          import json, subprocess, os, pathlib
          plan = os.environ.get("OPTIMIZER_PLAN", "go")
          matrix = [
              {"label": "Default (no training, region locked)", "flags": "", "model_id": ""},
              {"label": "Allow free training", "flags": "--allow-free-training", "model_id": ""},
              {"label": "Allow global region", "flags": "--allow-global-region", "model_id": ""},
              {"label": "Allow both (CI setting)", "flags": "--allow-global-region --allow-free-training", "model_id": ""}
          ]
          for row in matrix:
              cmd = ["uv", "run", "opencode-go-model-optimizer", "select", "--plan", plan, "--mode", "allowance", "--snapshot", "out/snapshot.json", "--format", "json"] + row["flags"].split()
              cmd = [c for c in cmd if c]
              res = subprocess.run(cmd, capture_output=True, text=True)
              if res.returncode != 0:
                  row["model_id"] = "Error"
              elif res.stdout.strip():
                  try:
                      data = json.loads(res.stdout)
                      row["model_id"] = data.get("tiers", {}).get("free", "None")
                  except Exception:
                      row["model_id"] = "Error"
          pathlib.Path("out/free-matrix.json").write_text(json.dumps(matrix, indent=2), encoding="utf-8")
          EOF

          run_url="${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
          render_args=(
            --allowance-json out/allowance/select.json
            --allowance-rank-json out/allowance/rank.json
            --allowance-plan-json "go=out/allowance/plans/go.json"
            --allowance-plan-json "go-plus=out/allowance/plans/go-plus.json"
            --allowance-plan-json "go-teams=out/allowance/plans/go-teams.json"
            --snapshot-json out/snapshot.json
            --script-output out/full_output.txt
            --run-url "$run_url"
            --site-url "$SITE_URL"
            --output out/issue.md
            --free-matrix-json out/free-matrix.json
            --charts-dir out/charts
            --analysis-output out/analysis.md
            --data-output out/data.md
          )
          if [[ "$pareto_status" -eq 0 ]]; then
            render_args+=(
              --pareto-json out/pareto/select.json
              --pareto-rank-json out/pareto/rank.json
              --pareto-plan-json "go=out/pareto/plans/go.json"
              --pareto-plan-json "go-plus=out/pareto/plans/go-plus.json"
              --pareto-plan-json "go-teams=out/pareto/plans/go-teams.json"
            )
          else
            render_args+=(--pareto-error out/pareto/error.txt)
          fi

          uv run python scripts/render_optimizer_issue.py "${render_args[@]}"

          cat out/issue.md >> "$GITHUB_STEP_SUMMARY"

          mkdir -p out/site
          cp -a docs/. out/site/
          cp out/issue.md out/site/README.md
          cp out/analysis.md out/site/analysis.md
          cp out/data.md out/site/data.md
          cp README.md out/site/usage.md
          cp out/snapshot.json out/site/snapshot.json
          cp out/free-matrix.json out/site/free-matrix.json
          cp out/full_output.txt out/site/full-output.txt
          cp out/fetch.log out/site/fetch-log.txt
          cp -a out/pareto out/site/pareto
          cp -a out/allowance out/site/allowance
          cp -a out/charts out/site/charts

          repo_url="${GITHUB_SERVER_URL}/${GH_REPO}"
          issues_url="${repo_url}/issues?q=is%3Aissue+is%3Aopen+label%3Aoptimizer-results"
          sed -i \
            -e "s|{{REPO_URL}}|${repo_url}|g" \
            -e "s|{{ISSUES_URL}}|${issues_url}|g" \
            out/site/index.html out/site/_sidebar.md out/site/data.md

          echo "pareto_status=$pareto_status" >> "$GITHUB_OUTPUT"
          echo "allowance_status=$allowance_status" >> "$GITHUB_OUTPUT"

      # The site is published by publish-pages.yml from this artifact; splitting
      # the build upload from the deploy keeps the same-job upload→deploy race
      # (deploy-pages querying the artifact API ~300 ms after upload finalized,
      # run 45897155638) out of this workflow entirely.
      - name: Upload Docsify site artifact
        if: always() && hashFiles('out/site/README.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: out/site
          retention-days: 1

      - name: Create or update GitHub issue
        if: always() && hashFiles('out/issue.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_LABEL: optimizer-results
          ISSUE_TITLE: "OpenCode Go Model Optimizer — Latest Tier Selections"
        run: |
          gh label create "$ISSUE_LABEL" \
            --repo "$GH_REPO" \
            --description "Automated OpenCode Go model optimizer results" \
            --color "0e8a16" \
            --force

          issue_number="$(gh issue list \
            --repo "$GH_REPO" \
            --label "$ISSUE_LABEL" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" \
              --repo "$GH_REPO" \
              --title "$ISSUE_TITLE" \
              --body-file out/issue.md
            echo "Updated existing issue #$issue_number"
          else
            gh issue create \
              --repo "$GH_REPO" \
              --title "$ISSUE_TITLE" \
              --label "$ISSUE_LABEL" \
              --body-file out/issue.md
          fi

      - name: Fail if Pareto or Allowance calculation failed
        if: steps.optimizer.outputs.pareto_status != '0' || steps.optimizer.outputs.allowance_status != '0'
        env:
          PARETO_STATUS: ${{ steps.optimizer.outputs.pareto_status }}
          ALLOWANCE_STATUS: ${{ steps.optimizer.outputs.allowance_status }}
        run: |
          echo "::error::Optimizer failed (pareto_status=$PARETO_STATUS, allowance_status=$ALLOWANCE_STATUS); both methods' outputs were still published."
          exit 1
