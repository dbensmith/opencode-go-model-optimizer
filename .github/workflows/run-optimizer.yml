name: Run Optimizer

# Runs the OpenCode Go model optimizer every 8 hours starting at 02:00 ET (07:00, 15:00,
# 23:00 UTC in EST / UTC-5) and on demand, retrieves AA_API_KEY from 1Password via a
# service account token, creates or updates the tracking GitHub issue labeled
# `optimizer-results`, AND publishes the Docsify site to GitHub Pages on the same schedule.
# Also runs tests on PRs and pushes to main.
#
# Runner choice: `ubuntu-latest` was selected over `ubuntu-slim` after benchmarking 5 runs
# each (ubuntu-latest averaged 12.80s exec / 14.80s wall vs ubuntu-slim 16.60s exec / 19.80s wall).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 02:00, 10:00, 18:00 EST (UTC-5) — GitHub Actions cron evaluates in UTC.
    - cron: "0 7,15,23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Optimizer mode (pareto, auto, or allowance)"
        required: false
        default: "pareto"
        type: choice
        options:
          - pareto
          - auto
          - allowance
      plan:
        description: "OpenCode plan tier"
        required: false
        default: "go"
        type: choice
        options:
          - go
          - go-plus
          - go-teams

permissions:
  contents: read

concurrency:
  group: run-optimizer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  optimize:
    needs: test
    if: github.event_name != 'pull_request'
    name: Run Optimizer, Update Issue & Publish Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          sync-args: "--no-dev"

      - name: Validate 1Password configuration
        env:
          HAS_OP_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
          SECRET_REF: ${{ secrets.AA_SECRET_REF || vars.AA_SECRET_REF }}
        run: |
          if [[ "$HAS_OP_TOKEN" != "true" ]]; then
            echo "::error::Repository secret OP_SERVICE_ACCOUNT_TOKEN is not set."
            exit 1
          fi
          if [[ -z "$SECRET_REF" ]]; then
            echo "::error::AA_SECRET_REF (op://<vault>/<item>/<field>) must be set in repository variables or secrets."
            exit 1
          fi

      # Set OP_SERVICE_ACCOUNT_TOKEN in repository secrets and AA_SECRET_REF
      # (op://<vault>/<item>/<field>) in repository variables or secrets.
      - name: Load AA API key from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          AA_API_KEY: ${{ secrets.AA_SECRET_REF || vars.AA_SECRET_REF }}

      - name: Run optimizer
        env:
          OPTIMIZER_MODE: ${{ inputs.mode || 'pareto' }}
          OPTIMIZER_PLAN: ${{ inputs.plan || 'go' }}
          UV_NO_SYNC: "1"
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p out
          # Run JSON first with --cache-ttl so the subsequent table run shares the exact snapshot.
          if ! scripts/run-optimizer.sh --plan "$OPTIMIZER_PLAN" --cache-ttl 300 --format json > out/select.json 2> out/script.log; then
            cat out/script.log >&2
            exit 1
          fi
          if ! scripts/run-optimizer.sh --plan "$OPTIMIZER_PLAN" --cache-ttl 300 > out/table.txt 2> out/table.err; then
            cat out/table.err >&2
            exit 1
          fi
          cp out/table.txt out/full_output.txt
          if [[ -s out/script.log || -s out/table.err ]]; then
            printf '\n--- stderr ---\n' >> out/full_output.txt
            cat out/script.log out/table.err >> out/full_output.txt
          fi
          run_url="${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
          uv run python scripts/render_optimizer_issue.py \
            --json out/select.json \
            --script-output out/full_output.txt \
            --run-url "$run_url" \
            --output out/issue.md
          cat out/issue.md >> "$GITHUB_STEP_SUMMARY"

          mkdir -p out/site
          cp -a docs/. out/site/
          cp out/issue.md out/site/README.md
          cp README.md out/site/usage.md
          cp out/select.json out/site/select.json

          repo_url="${GITHUB_SERVER_URL}/${GH_REPO}"
          issues_url="${repo_url}/issues?q=is%3Aissue+is%3Aopen+label%3Aoptimizer-results"
          sed -i \
            -e "s|{{REPO_URL}}|${repo_url}|g" \
            -e "s|{{ISSUES_URL}}|${issues_url}|g" \
            out/site/index.html out/site/_sidebar.md

      - name: Create or update GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_LABEL: optimizer-results
          ISSUE_TITLE: "OpenCode Go Model Optimizer — Latest Tier Selections"
        run: |
          gh label create "$ISSUE_LABEL" \
            --repo "$GH_REPO" \
            --description "Automated OpenCode Go model optimizer results" \
            --color "0e8a16" \
            --force

          issue_number="$(gh issue list \
            --repo "$GH_REPO" \
            --label "$ISSUE_LABEL" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" \
              --repo "$GH_REPO" \
              --title "$ISSUE_TITLE" \
              --body-file out/issue.md
            echo "Updated existing issue #$issue_number"
          else
            gh issue create \
              --repo "$GH_REPO" \
              --title "$ISSUE_TITLE" \
              --label "$ISSUE_LABEL" \
              --body-file out/issue.md
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
