name: Benchmark Runners (Temporary)

on:
  push:
    branches: [run-optimizer-and-report-back]

permissions:
  contents: read
  issues: read

jobs:
  benchmark:
    name: Benchmark (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-slim, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Check 1Password secret availability
        id: op_check
        run: |
          echo "has_token=${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_ref=${{ secrets.AA_SECRET_REF != '' || vars.AA_SECRET_REF != '' }}" >> "$GITHUB_OUTPUT"

      - name: Load AA API key from 1Password
        if: steps.op_check.outputs.has_token == 'true' && steps.op_check.outputs.has_ref == 'true'
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          AA_API_KEY: ${{ secrets.AA_SECRET_REF || vars.AA_SECRET_REF }}

      - name: Run optimizer and format GitHub issue body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          if [[ -n "${AA_API_KEY:-}" ]]; then
            OPTIMIZER_MODE=pareto scripts/run-optimizer.sh --cache-ttl 300 --format json > out/select.json 2> out/script.log
            OPTIMIZER_MODE=pareto scripts/run-optimizer.sh --cache-ttl 300 > out/table.txt 2>> out/script.log
          else
            uv run opencode-go-model-optimizer select --mode allowance --format json --explain --cache-ttl 300 > out/select.json 2> out/script.log
            uv run opencode-go-model-optimizer select --mode allowance --format table --explain --cache-ttl 300 > out/table.txt 2>> out/script.log
          fi
          cat out/table.txt >> out/full_output.txt
          if [[ -s out/script.log ]]; then
            printf '\n--- stderr ---\n' >> out/full_output.txt
            cat out/script.log >> out/full_output.txt
          fi
          uv run python scripts/render_optimizer_issue.py \
            --json out/select.json \
            --script-output out/full_output.txt \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output out/issue.md
          gh issue list --repo "${{ github.repository }}" --label "optimizer-results" --state open --json number --jq '.[0].number // empty'
