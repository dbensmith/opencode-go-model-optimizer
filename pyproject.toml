[project]
name = "opencode-go-model-optimizer"
version = "0.1.0"
description = "Dynamic model tiering, Pareto efficiency ranker, and capability tier selector for OpenCode Go"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
]
license = { text = "MIT" }
authors = [
    { name = "dbensmith", email = "10767946+dbensmith@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2.12.0,<3",
]

[project.scripts]
opencode-go-model-optimizer = "opencode_go_model_optimizer.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Long comments and string literals cannot be wrapped by the formatter.
    "E501",
]

[tool.pytest.ini_options]
markers = [
    "live: contract tests against the real OpenCode/models.dev sources (run with OCGO_LIVE=1)",
]
