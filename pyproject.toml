[project]
name = "opencode-go-model-optimizer"
version = "0.1.0"
description = "Dynamic model tiering, Pareto efficiency ranker, and capability tier selector for OpenCode Go"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "dbensmith", email = "10767946+dbensmith@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.scripts]
opencode-go-model-optimizer = "opencode_go_model_optimizer.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
